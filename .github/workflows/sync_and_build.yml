name: Auto Sync and Build keepteen_lt1

on:
  schedule:
    - cron: '0 */6 * * *' # Prüft alle 6 Stunden
  workflow_dispatch:      # Ermöglicht manuelles Starten per Klick

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Wichtig, um Releases zu erstellen und Code zu pushen

    steps:
      - name: Get latest upstream release
        id: upstream
        run: |
          # Hol den neuesten Tag von Meshtastic
          LATEST_TAG=$(curl -s https://api.github.com/repos/meshtastic/firmware/releases/latest | jq -r .tag_name)
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Checkout keepteen branch
        uses: actions/checkout@v4
        with:
          ref: keepteen
          fetch-depth: 0 # Wichtig für Rebase

      - name: Check if already built
        id: check
        run: |
          # Prüft, ob ein Release mit diesem Tag in DEINEM Repo existiert
          MY_TAG="${{ steps.upstream.outputs.tag }}-keepteen"
          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ github.repository }}/releases/tags/$MY_TAG)
          if [ "$EXISTS" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync and Rebase
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git remote add upstream https://github.com/meshtastic/firmware.git
          git fetch upstream --tags
          
          # Rebase auf den neusten Release-Tag von Meshtastic
          git rebase ${{ steps.upstream.outputs.tag }}
          git push origin keepteen --force

      - name: Set up Python
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PlatformIO
        if: steps.check.outputs.skip == 'false'
        run: |
          python3 -m pip install -U platformio

      - name: Build keepteen_lt1
        if: steps.check.outputs.skip == 'false'
        run: |
          # Führt den Build aus
          pio run -e keepteen_lt1
          
          # Dateien umbenennen für besseren Überblick im Release
          mkdir -p release_assets
          TAG_NAME="${{ steps.upstream.outputs.tag }}"
          
          # Kopiere die uf2 Datei
          cp .pio/build/keepteen_lt1/firmware.uf2 release_assets/meshtastic-${TAG_NAME}-keepteen_lt1.uf2
          
          # Erstelle ein Zip des Build-Ordners (optional, wie gewünscht)
          cd .pio/build/keepteen_lt1/
          zip -r ../../../release_assets/meshtastic-${TAG_NAME}-keepteen_lt1.zip .
          cd ../../../

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}-keepteen
          name: "Keepteen Build: Meshtastic ${{ steps.upstream.outputs.tag }}"
          body: |
            Automatischer Build für keepteen_lt1 basierend auf Meshtastic Release ${{ steps.upstream.outputs.tag }}.
            
            Synchronisiert am: $(date +'%Y-%m-%d %H:%M')
          draft: false
          prerelease: false
          files: |
            release_assets/*.uf2
            release_assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
