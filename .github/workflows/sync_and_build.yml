name: Auto Sync and Build keepteen_lt1

on:
  schedule:
    - cron: '0 */6 * * *' # Alle 6 Stunden prüfen
  workflow_dispatch:      # Manueller Start möglich

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.upstream.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Get latest upstream release
        id: upstream
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/meshtastic/firmware/releases/latest | jq -r .tag_name)
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Checkout keepteen branch
        uses: actions/checkout@v4
        with:
          ref: keepteen
          fetch-depth: 0

      - name: Check if already built
        id: check
        run: |
          MY_TAG="${{ steps.upstream.outputs.tag }}-keepteen"
          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ github.repository }}/releases/tags/$MY_TAG)
          if [ "$EXISTS" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync and Rebase
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git remote add upstream https://github.com/meshtastic/firmware.git
          git fetch upstream --tags
          git rebase ${{ steps.upstream.outputs.tag }}
          git push origin keepteen --force

  build:
    needs: check-and-sync
    if: needs.check-and-sync.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout keepteen branch
        uses: actions/checkout@v4
        with:
          ref: keepteen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install PlatformIO
        run: |
          python3 -m pip install -U platformio
          # Hier nutzen wir die Logik von build_one_target: 
          # Vorab-Installation der Toolchains, falls nötig
          pio pkg install --environment keepteen_lt1

      - name: Build Device
        env:
          # Diese Variable zwingt PlatformIO, nur dieses Environment zu laden
          PLATFORMIO_DEFAULT_ENVS: keepteen_lt1
        run: |
          # Wir bauen gezielt nur das Target, wie in build_one_target.yml
          pio run -e keepteen_lt1
          
          # Erstellen der Release-Struktur
          mkdir -p release_assets
          TAG="${{ needs.check-and-sync.outputs.tag }}"
          
          # UF2 Datei kopieren
          cp .pio/build/keepteen_lt1/firmware.uf2 release_assets/meshtastic-${TAG}-keepteen_lt1.uf2
          
          # Zip erstellen
          cd .pio/build/keepteen_lt1/
          zip -r ../../../release_assets/meshtastic-${TAG}-keepteen_lt1.zip .
          cd ../../../

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-and-sync.outputs.tag }}-keepteen
          name: "Keepteen Build: Meshtastic ${{ needs.check-and-sync.outputs.tag }}"
          body: "Automatischer Build für keepteen_lt1 basierend auf Meshtastic ${{ needs.check-and-sync.outputs.tag }}"
          files: |
            release_assets/*.uf2
            release_assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
