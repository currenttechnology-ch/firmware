name: Auto Sync and Build keepteen_lt1

on:
  schedule:
    - cron: '0 */6 * * *' # Alle 6 Stunden prüfen
  workflow_dispatch:      # Manueller Start möglich

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.upstream.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Get latest upstream release
        id: upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/meshtastic/firmware/tags | jq -r '.[].name' | grep -E '^v[0-9]' | sort -V | tail -n 1 | tr -d '\r\n')

          # Sicherheitscheck: Falls die API down ist oder leer bleibt, brechen wir kontrolliert ab
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Fehler: Konnte den Upstream-Tag nicht abrufen (Rate-Limit oder API-Fehler)."
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Checkout keepteen branch
        uses: actions/checkout@v4
        with:
          ref: keepteen
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if already built
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MY_TAG="${{ steps.upstream.outputs.tag }}-keepteen"
          EXISTS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" -o /dev/null -w "%{http_code}" https://api.github.com/repos/${{ github.repository }}/releases/tags/$MY_TAG)
          if [ "$EXISTS" = "200" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync and Rebase
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git remote add upstream https://github.com/meshtastic/firmware.git
          git fetch upstream --tags -f
            # Wir stellen sicher, dass wir auf dem richtigen Branch sind
          git checkout keepteen

          git rebase ${{ steps.upstream.outputs.tag }}
          git push origin keepteen --force

  build:
    needs: check-and-sync
    if: needs.check-and-sync.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout keepteen branch
        uses: actions/checkout@v4
        with:
          ref: keepteen

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install PlatformIO
        run: |
          python3 -m pip install -U platformio
          # Hier nutzen wir die Logik von build_one_target: 
          # Vorab-Installation der Toolchains, falls nötig
          pio pkg install --environment keepteen_lt1

      - name: Build Device
        id: build_step
        env:
          # Diese Variable zwingt PlatformIO, nur dieses Environment zu laden
          PLATFORMIO_DEFAULT_ENVS: keepteen_lt1
        run: |
          # Wir bauen gezielt nur das Target, wie in build_one_target.yml
          pio run -e keepteen_lt1
          
          # Erstellen der Release-Struktur
          mkdir -p release_assets
          FULL_NAME=$(ls .pio/build/keepteen_lt1/firmware*.uf2 | head -n 1)
          FILE_NAME=$(basename $FULL_NAME)
          # Extrahiert alles zwischen dem zweiten Bindestrich und .uf2
          REAL_VERSION=$(echo $FILE_NAME | sed -E 's/firmware-keepteen_lt1-(.*)\.uf2/\1/')

          echo "Verwendete Version: $REAL_VERSION"
          echo "real_version=$REAL_VERSION" >> $GITHUB_OUTPUT

        


          
          cp .pio/build/keepteen_lt1/firmware*.uf2 release_assets/
          cp .pio/build/keepteen_lt1/firmware*.zip release_assets/

          # Kontrolle im Log
          ls -l release_assets/
          

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          #tag_name: v${{ steps.build_step.outputs.real_version }}-keepteen
          tag_name: ${{ needs.check-and-sync.outputs.tag }}-keepteen
          name: "Keepteen Build: Meshtastic ${{ needs.check-and-sync.outputs.tag }}"
          body: "Automatic build for keepteen_lt1 based on Meshtastic ${{ needs.check-and-sync.outputs.tag }}"
          files: |
            release_assets/*.uf2
            release_assets/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
