<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepteen Firmware Downloads</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; line-height: 1.6; }
        select, button { padding: 10px; width: 100%; margin-top: 10px; font-size: 16px; }
        .info { background: #f4f4f4; padding: 15px; border-radius: 5px; margin-top: 20px; }
        .version-tag { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Keepteen LT1 Firmware</h1>
    <p>Wähle eine Version zum Download aus:</p>

    <select id="release-select">
        <option>Lade Releases...</option>
    </select>

    <div id="download-area" style="display:none;">
        <div class="info">
            <p>Aktuell gewählt: <span id="selected-version" class="version-tag"></span></p>
            <p id="release-body"></p>
            <button id="download-uf2">Download .UF2 (Firmware)</button>
            <button id="download-zip" style="background:#eee; color:#333;">Download .ZIP (Komplettpaket)</button>
        </div>
    </div>

    <script>
        // DEIN REPO PFAD HIER EINTRAGEN:
        const REPO = "currenttechnology-ch/firmware"; 

        async function fetchReleases() {
            const response = await fetch(`https://api.github.com/repos/${REPO}/releases`);
            const releases = await response.json();
            const select = document.getElementById('release-select');
            const downloadArea = document.getElementById('download-area');
            
            select.innerHTML = ''; // Platzhalter löschen

            // Filtern: Nur Releases, die "-keepteen" im Tag haben
            const keepteenReleases = releases.filter(r => r.tag_name.includes('keepteen'));

            if (keepteenReleases.length === 0) {
                select.innerHTML = '<option>Keine Keepteen-Releases gefunden</option>';
                return;
            }

            keepteenReleases.forEach((rel, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = rel.name || rel.tag_name;
                select.appendChild(opt);
            });

            const updateView = (index) => {
                const rel = keepteenReleases[index];
                document.getElementById('selected-version').textContent = rel.tag_name;
                document.getElementById('release-body').textContent = rel.body;
                
                // Download-Links zuweisen
                const uf2Asset = rel.assets.find(a => a.name.endsWith('.uf2'));
                const zipAsset = rel.assets.find(a => a.name.endsWith('.zip'));

                document.getElementById('download-uf2').onclick = () => window.location.href = uf2Asset.browser_download_url;
                document.getElementById('download-zip').onclick = () => window.location.href = zipAsset.browser_download_url;
                
                downloadArea.style.display = 'block';
            };

            select.onchange = (e) => updateView(e.target.value);
            updateView(0); // Standardmäßig das neueste (erste) Release anzeigen
        }

        fetchReleases();
    </script>
</body>
</html>
