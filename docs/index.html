<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepteen Firmware Downloads</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #2ecc71;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --muted-text: #7f8c8d;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .header-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 25px;
        }

        .logo {
            max-height: 80px;
            margin-bottom: 15px;
            object-fit: contain;
        }

        h1 {
            font-size: 24px;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted-text);
            font-size: 15px;
        }

        .lang-selector-wrapper {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .lang-selector {
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            outline: none;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--primary-color);
        }

        select.main-select {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            cursor: pointer;
            transition: border-color 0.2s;
            outline: none;
        }

        select.main-select:focus {
            border-color: var(--primary-color);
        }

        optgroup {
            font-weight: 700;
            background: #f1f5f9;
            color: var(--primary-color);
        }

        option {
            font-weight: normal;
            background: #fff;
            color: var(--text-color);
            padding: 8px;
        }

        .download-card {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 25px;
            margin-top: 25px;
            border-left: 4px solid var(--accent-color);
        }

        .version-info {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--primary-color);
        }

        .version-tag {
            background: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            margin-left: 6px;
            display: inline-block;
        }

        .release-notes {
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 20px;
            color: #4a5568;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 12px;
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #1a252f;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="lang-selector-wrapper">
            <select id="lang-select" class="lang-selector">
                <option value="de">Deutsch</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
            </select>
        </div>

        <div class="header-zone">
            <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none';">
            <h1 id="ui-title">Keepteen LT1 Firmware</h1>
            <p id="ui-subtitle" class="subtitle">Wähle eine Version zum Download aus:</p>
        </div>

        <div class="form-group">
            <label id="ui-label-select" for="release-select">Verfügbare Versionen:</label>
            <select id="release-select" class="main-select">
                <option id="ui-loading">Lade Releases...</option>
            </select>
        </div>

        <div id="download-area" style="display:none;">
            <div class="download-card">
                <div class="version-info">
                    <span id="ui-selected-prefix">Aktuell gewählt:</span> 
                    <span id="selected-version" class="version-tag"></span>
                </div>
                <div id="release-body" class="release-notes"></div>
                
                <button id="download-uf2" class="btn btn-primary">Download .UF2 (Firmware)</button>
                <button id="download-zip" class="btn btn-secondary">Download .ZIP (Komplettpaket)</button>
            </div>
        </div>
    </div>

    <script>
        const REPO = "currenttechnology-ch/firmware"; 

        // Übersetzungsdatenbank für die UI-Texte
        const translations = {
            de: {
                title: "Keepteen LT1 Firmware",
                subtitle: "Wähle eine Version zum Download aus:",
                labelSelect: "Verfügbare Versionen:",
                loading: "Lade Releases...",
                noReleases: "Keine Keepteen-Releases gefunden",
                error: "Fehler beim Laden",
                selectedPrefix: "Aktuell gewählt:",
                groupStable: "Stabiler",
                groupNew: "Neuer"
            },
            en: {
                title: "Keepteen LT1 Firmware",
                subtitle: "Select a version to download:",
                labelSelect: "Available Versions:",
                loading: "Loading releases...",
                noReleases: "No Keepteen releases found",
                error: "Error loading data",
                selectedPrefix: "Currently selected:",
                groupStable: "Stable",
                groupNew: "New"
            },
            zh: {
                title: "Keepteen LT1 固件下载",
                subtitle: "请选择需要下载的版本：",
                labelSelect: "可用版本：",
                loading: "正在加载固件版本...",
                noReleases: "未找到 Keepteen 固件版本",
                error: "加载失败",
                selectedPrefix: "当前选择：",
                groupStable: "稳定版",
                groupNew: "最新版"
            }
        };

        // Standard-Sprache über den Browser ermitteln
        let currentLang = 'de';
        const browserLang = navigator.language || navigator.userLanguage;
        if (browserLang.startsWith('zh')) currentLang = 'zh';
        else if (browserLang.startsWith('en')) currentLang = 'en';

        let allSortedReleases = [];

        // Funktion zum Übersetzen der statischen Seitenelemente
        function updateStaticUI() {
            const t = translations[currentLang];
            document.getElementById('ui-title').textContent = t.title;
            document.getElementById('ui-subtitle').textContent = t.subtitle;
            document.getElementById('ui-label-select').textContent = t.labelSelect;
            document.getElementById('ui-selected-prefix').textContent = t.selectedPrefix;
            document.getElementById('lang-select').value = currentLang;
        }

        async function fetchReleases() {
            try {
                updateStaticUI();
                const response = await fetch(`https://api.github.com/repos/${REPO}/releases`);
                const releases = await response.json();
                
                renderDropdown(releases);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('release-select').innerHTML = `<option>${translations[currentLang].error}</option>`;
            }
        }

        // Strukturierte Darstellung im Dropdown (Trennung Stable / New)
        function renderDropdown(releases) {
            const select = document.getElementById('release-select');
            const t = translations[currentLang];
            select.innerHTML = ''; 

            const keepteenReleases = releases.filter(r => r.tag_name.includes('keepteen'));

            if (keepteenReleases.length === 0) {
                select.innerHTML = `<option>${t.noReleases}</option>`;
                return;
            }

            const betaReleases = keepteenReleases.filter(r => r.prerelease === false);
            const alphaReleases = keepteenReleases.filter(r => r.prerelease === true);

            allSortedReleases = [];

            // 1. Gruppe: Beta (angeschrieben als "Stabiler" / "Stable" / "稳定版")
            if (betaReleases.length > 0) {
                const groupBeta = document.createElement('optgroup');
                groupBeta.label = t.groupStable;
                
                betaReleases.forEach(rel => {
                    const opt = document.createElement('option');
                    opt.value = allSortedReleases.length;
                    opt.textContent = rel.name || rel.tag_name;
                    groupBeta.appendChild(opt);
                    allSortedReleases.push(rel);
                });
                select.appendChild(groupBeta);
            }

            // 2. Gruppe: Alpha (angeschrieben als "Neuer" / "New" / "最新版")
            if (alphaReleases.length > 0) {
                const groupAlpha = document.createElement('optgroup');
                groupAlpha.label = t.groupNew;
                
                alphaReleases.forEach(rel => {
                    const opt = document.createElement('option');
                    opt.value = allSortedReleases.length;
                    opt.textContent = rel.name || rel.tag_name;
                    groupAlpha.appendChild(opt);
                    allSortedReleases.push(rel);
                });
                select.appendChild(groupAlpha);
            }

            updateView(0);
        }

        const updateView = (index) => {
            const rel = allSortedReleases[index];
            const downloadArea = document.getElementById('download-area');
            if (!rel) {
                downloadArea.style.display = 'none';
                return;
            }

            document.getElementById('selected-version').textContent = rel.tag_name;
            document.getElementById('release-body').textContent = rel.body || "";
            
            const uf2Asset = rel.assets.find(a => a.name.endsWith('.uf2'));
            const zipAsset = rel.assets.find(a => a.name.endsWith('.zip'));

            const btnUf2 = document.getElementById('download-uf2');
            if (uf2Asset) {
                btnUf2.style.display = 'block';
                btnUf2.onclick = () => window.location.href = uf2Asset.browser_download_url;
            } else {
                btnUf2.style.display = 'none';
            }

            const btnZip = document.getElementById('download-zip');
            if (zipAsset) {
                btnZip.style.display = 'block';
                btnZip.onclick = () => window.location.href = zipAsset.browser_download_url;
            } else {
                btnZip.style.display = 'none';
            }
            
            downloadArea.style.display = 'block';
        };

        // Event-Listener für Dropdown-Wechsel der Releases
        document.getElementById('release-select').onchange = (e) => updateView(e.target.value);
        
        // Event-Listener für manuellen Sprachwechsel
        document.getElementById('lang-select').onchange = (e) => {
            currentLang = e.target.value;
            updateStaticUI();
            
            // Wenn bereits Daten geladen sind, bauen wir die Dropdown-Gruppen live neu auf (ohne erneuten API-Call)
            if(allSortedReleases.length > 0) {
                const select = document.getElementById('release-select');
                const selectedIdx = select.value;
                select.innerHTML = '';
                const t = translations[currentLang];
                
                const betaElements = allSortedReleases.filter(r => r.prerelease === false);
                const alphaElements = allSortedReleases.filter(r => r.prerelease === true);
                
                let trackIdx = 0;
                if(betaElements.length > 0) {
                    const g = document.createElement('optgroup'); g.label = t.groupStable;
                    betaElements.forEach(r => {
                        const o = document.createElement('option'); o.value = trackIdx++; o.textContent = r.name || r.tag_name; g.appendChild(o);
                    });
                    select.appendChild(g);
                }
                if(alphaElements.length > 0) {
                    const g = document.createElement('optgroup'); g.label = t.groupNew;
                    alphaElements.forEach(r => {
                        const o = document.createElement('option'); o.value = trackIdx++; o.textContent = r.name || r.tag_name; g.appendChild(o);
                    });
                    select.appendChild(g);
                }
                select.value = selectedIdx;
                updateView(selectedIdx);
            }
        };

        // Initialer Start
        fetchReleases();
    </script>
</body>
</html>
