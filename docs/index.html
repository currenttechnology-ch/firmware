<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keepteen Firmware Downloads</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #2ecc71;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --muted-text: #7f8c8d;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .header-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 25px;
        }

        .logo {
            max-height: 80px;
            margin-bottom: 15px;
            object-fit: contain;
        }

        h1 {
            font-size: 24px;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--muted-text);
            font-size: 15px;
        }

        .lang-selector-wrapper {
            position: absolute;
            top: 15px;
            right: 15px;
        }

        .lang-selector {
            padding: 6px 10px;
            font-size: 13px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            cursor: pointer;
            outline: none;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--primary-color);
        }

        select.main-select {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            cursor: pointer;
            transition: border-color 0.2s;
            outline: none;
        }

        select.main-select:focus {
            border-color: var(--primary-color);
        }

        optgroup {
            font-weight: 700;
            background: #f1f5f9;
            color: var(--primary-color);
        }

        option {
            font-weight: normal;
            background: #fff;
            color: var(--text-color);
            padding: 8px;
        }

        .download-card {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 25px;
            margin-top: 25px;
            border-left: 4px solid var(--accent-color);
        }

        .version-info {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--primary-color);
        }

        .version-tag {
            background: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
            margin-left: 6px;
            display: inline-block;
        }

        .release-notes {
            background: #fff;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 20px;
            color: #4a5568;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 12px;
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: #1a252f;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        /* Styling für die Update-Anleitung */
        .instructions-card {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px solid var(--border-color);
        }

        .instructions-card h2 {
            font-size: 18px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .instructions-card ol {
            padding-left: 20px;
            color: #4a5568;
            font-size: 15px;
        }

        .instructions-card li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="lang-selector-wrapper">
            <select id="lang-select" class="lang-selector">
                <option value="de">Deutsch</option>
                <option value="en">English</option>
                <option value="zh">中文</option>
            </select>
        </div>

        <div class="header-zone">
            <a href='https://currenttechnology.ch'>
            <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none';">
            </a>
            <h1 id="ui-title">Keepteen LT1 Firmware</h1>
            <p id="ui-subtitle" class="subtitle">Wähle eine Version zum Download aus:</p>
        </div>

        <div class="form-group">
            <label id="ui-label-select" for="release-select">Verfügbare Versionen:</label>
            <select id="release-select" class="main-select">
                <option id="ui-loading">Lade Releases...</option>
            </select>
        </div>

        <div id="download-area" style="display:none;">
            <div class="download-card">
                <div class="version-info">
                    <span id="ui-selected-prefix">Aktuell gewählt:</span> 
                    <span id="selected-version" class="version-tag"></span>
                </div>
                <div id="release-body" class="release-notes"></div>
                
                <button id="download-uf2" class="btn btn-primary">Download .UF2 (Firmware)</button>
                <button id="download-zip" class="btn btn-secondary">Download .ZIP (Komplettpaket)</button>
            </div>
        </div>

        <div class="instructions-card">
            <h2 id="ui-instr-title">Updatevorgang:</h2>
            <ol id="ui-instr-list">
                </ol>
        </div>
    </div>

    <script>
        const MY_REPO = "currenttechnology-ch/firmware"; 
        const UPSTREAM_REPO = "meshtastic/firmware";

        const translations = {
            de: {
                title: "Keepteen LT1 Firmware",
                subtitle: "Wähle eine Version zum Download aus:",
                labelSelect: "Verfügbare Versionen:",
                loading: "Lade Releases...",
                noReleases: "Keine Keepteen-Releases gefunden",
                error: "Fehler beim Laden",
                selectedPrefix: "Aktuell gewählt:",
                groupStable: "Stabiler",
                groupNew: "Neuer",
                instrTitle: "Updatevorgang:",
                steps: [
                    "Gewünschte Firmware als uf2 runterladen",
                    "Geräte per USB anhängen.",
                    "Reset-Taste zweimal betätigen",
                    "Ein neues Laufwerk wird sichtbar",
                    "uf2 Datei auf neues Laufwerk kopieren",
                    "Warten, das Gerät wird sich neu starten"
                ]
            },
            en: {
                title: "Keepteen LT1 Firmware",
                subtitle: "Select a version to download:",
                labelSelect: "Available Versions:",
                loading: "Loading releases...",
                noReleases: "No Keepteen releases found",
                error: "Error loading data",
                selectedPrefix: "Currently selected:",
                groupStable: "Stable",
                groupNew: "New",
                instrTitle: "Update Process:",
                steps: [
                    "Download the desired firmware as a .uf2 file",
                    "Connect the device via USB.",
                    "Press the reset button twice",
                    "A new drive will become visible",
                    "Copy the .uf2 file onto the new drive",
                    "Wait, the device will restart automatically"
                ]
            },
            zh: {
                title: "Keepteen LT1 固件下载",
                subtitle: "请选择需要下载的版本：",
                labelSelect: "可用版本：",
                loading: "正在加载固件版本...",
                noReleases: "未找到 Keepteen 固件版本",
                error: "加载失败",
                selectedPrefix: "当前选择：",
                groupStable: "稳定版",
                groupNew: "最新版",
                instrTitle: "升级步骤：",
                steps: [
                    "下载所需的 .uf2 格式固件文件",
                    "通过 USB 连接设备。",
                    "连续按两次复位 (Reset) 键",
                    "电脑上会出现一个新的盘符",
                    "将 .uf2 文件 inside/复制到新盘符中",
                    "等待设备自动重新启动"
                ]
            }
        };

        // Standard-Sprache über den Browser ermitteln
        let currentLang = 'de';
        const browserLang = navigator.language || navigator.userLanguage;
        if (browserLang.startsWith('zh')) currentLang = 'zh';
        else if (browserLang.startsWith('en')) currentLang = 'en';

        // Listen für getrennte Speicherung nach dem echten Upstream-Status
        let stableReleasesList = [];
        let newReleasesList = [];
        let allSortedReleases = [];

        function updateStaticUI() {
            const t = translations[currentLang];
            document.getElementById('ui-title').textContent = t.title;
            document.getElementById('ui-subtitle').textContent = t.subtitle;
            document.getElementById('ui-label-select').textContent = t.labelSelect;
            document.getElementById('ui-selected-prefix').textContent = t.selectedPrefix;
            document.getElementById('lang-select').value = currentLang;
            
            // Anleitung aktualisieren
            document.getElementById('ui-instr-title').textContent = t.instrTitle;
            const listContainer = document.getElementById('ui-instr-list');
            listContainer.innerHTML = '';
            t.steps.forEach(step => {
                const li = document.createElement('li');
                li.textContent = step;
                listContainer.appendChild(li);
            });
        }

        async function fetchReleases() {
            try {
                updateStaticUI();
                
                // Beide Repositories parallel abfragen
                const [myRes, upstreamRes] = await Promise.all([
                    fetch(`https://api.github.com/repos/${MY_REPO}/releases`),
                    fetch(`https://api.github.com/repos/${UPSTREAM_REPO}/releases`)
                ]);
                
                const myReleases = await myRes.json();
                const upstreamReleases = await upstreamRes.json();
                
                processAndRender(myReleases, upstreamReleases);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('release-select').innerHTML = `<option>${translations[currentLang].error}</option>`;
            }
        }

        function processAndRender(myReleases, upstreamReleases) {
            const select = document.getElementById('release-select');
            const t = translations[currentLang];
            select.innerHTML = ''; 

            // Nur deine eigenen Keepteen-Releases filtern
            const keepteenReleases = myReleases.filter(r => r.tag_name.includes('keepteen'));

            if (keepteenReleases.length === 0) {
                select.innerHTML = `<option>${t.noReleases}</option>`;
                return;
            }

            // Map der Upstream-Releases für schnellen Zugriff erstellen (Key ist der reine Tag, z.B. "v2.7.24.472b14c")
            const upstreamMap = new Map();
            upstreamReleases.forEach(r => {
                upstreamMap.set(r.tag_name, r);
            });

            stableReleasesList = [];
            newReleasesList = [];

            keepteenReleases.forEach(myRel => {
                // Ermittle das vermutliche Upstream-Tag (z.B. "v2.7.24.472b14c-keepteen" -> "v2.7.24.472b14c")
                // Falls du kein "v" vorn hast, sichern wir das ebenfalls ab.
                const upstreamTagName = myRel.tag_name.split('-keepteen')[0];
                
                const upstreamMatch = upstreamMap.get(upstreamTagName) || upstreamMap.get('v' + upstreamTagName);
                
                if (upstreamMatch) {
                    // Abgleich mit dem echten Upstream-Repository!
                    // Wenn dort prerelease === true steht, ist es eine Alpha ("Neuer").
                    // Wenn prerelease === false steht, ist es eine Beta/Stable ("Stabiler").
                    if (upstreamMatch.prerelease === true) {
                        newReleasesList.push(myRel);
                    } else {
                        stableReleasesList.push(myRel);
                    }
                } else {
                    newReleasesList.push(myRel);
                }
            });

            buildDropdownOptions();
            updateView(0);
        }

        function buildDropdownOptions() {
            const select = document.getElementById('release-select');
            const t = translations[currentLang];
            select.innerHTML = '';
            allSortedReleases = [];

            // 1. Gruppe: Stabiler (Entspricht Meshtastic prerelease: false)
            if (stableReleasesList.length > 0) {
                const groupStable = document.createElement('optgroup');
                groupStable.label = t.groupStable;
                
                stableReleasesList.forEach(rel => {
                    const opt = document.createElement('option');
                    opt.value = allSortedReleases.length;
                    opt.textContent = rel.name || rel.tag_name;
                    groupStable.appendChild(opt);
                    allSortedReleases.push(rel);
                });
                select.appendChild(groupStable);
            }

            // 2. Gruppe: Neuer (Entspricht Meshtastic prerelease: true)
            if (newReleasesList.length > 0) {
                const groupNew = document.createElement('optgroup');
                groupNew.label = t.groupNew;
                
                newReleasesList.forEach(rel => {
                    const opt = document.createElement('option');
                    opt.value = allSortedReleases.length;
                    opt.textContent = rel.name || rel.tag_name;
                    groupNew.appendChild(opt);
                    allSortedReleases.push(rel);
                });
                select.appendChild(groupNew);
            }
        }

        const updateView = (index) => {
            const rel = allSortedReleases[index];
            const downloadArea = document.getElementById('download-area');
            if (!rel) {
                downloadArea.style.display = 'none';
                return;
            }

            document.getElementById('selected-version').textContent = rel.tag_name;
            document.getElementById('release-body').textContent = rel.body || "";
            
            const uf2Asset = rel.assets.find(a => a.name.endsWith('.uf2'));
            const zipAsset = rel.assets.find(a => a.name.endsWith('.zip'));

            const btnUf2 = document.getElementById('download-uf2');
            if (uf2Asset) {
                btnUf2.style.display = 'block';
                btnUf2.onclick = () => window.location.href = uf2Asset.browser_download_url;
            } else {
                btnUf2.style.display = 'none';
            }

            const btnZip = document.getElementById('download-zip');
            if (zipAsset) {
                btnZip.style.display = 'block';
                btnZip.onclick = () => window.location.href = zipAsset.browser_download_url;
            } else {
                btnZip.style.display = 'none';
            }
            
            downloadArea.style.display = 'block';
        };

        document.getElementById('release-select').onchange = (e) => updateView(e.target.value);
        
        document.getElementById('lang-select').onchange = (e) => {
            currentLang = e.target.value;
            updateStaticUI();
            
            if(allSortedReleases.length > 0) {
                const select = document.getElementById('release-select');
                const selectedIdx = select.value;
                
                buildDropdownOptions();
                
                select.value = selectedIdx;
                updateView(selectedIdx);
            }
        };

        // Initialer Start
        fetchReleases();
    </script>
</body>
</html>
